<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e3">
<title>うつろいの花畑</title>
<meta name="description" content="誰も手を入れない花畑が、虫と風と天気にまかせて、年ごとに色と形を変えていきます。エリカの観察日記。">
<meta property="og:title" content="うつろいの花畑">
<meta property="og:description" content="誰も手を入れない花畑が、虫と風と天気にまかせて進化していきます。">
<meta property="og:image" content="https://amanesf.github.io/hanabatake/title.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f1e3;--ink:#5c4a44;--ink2:#9c8a80;--pink:#eaa3b8;--aqua:#86cfdc;--leaf:#8fb27e;--line:rgba(110,84,76,.42);
  --hand:255px 18px 225px 16px/16px 225px 18px 255px;--hand2:18px 240px 20px 225px/225px 20px 240px 18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f8f3e6;overflow:hidden;overscroll-behavior:none}
body{font-family:'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:relative;width:100vw;height:100vh;height:100dvh;max-width:calc(100dvh*.62);background:var(--paper);overflow:hidden}
@media (max-aspect-ratio:62/100){#stage{max-width:none}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#paper{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background-size:256px 256px;z-index:60;box-shadow:inset 0 0 70px rgba(150,120,80,.22),inset 0 0 8px rgba(120,90,60,.25)}

/* 日付 */
#hud{position:absolute;left:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;z-index:10;pointer-events:none}
#date{display:flex;align-items:baseline;gap:3px;font-family:'Kaisei Decol',serif;color:#5a4a52;text-shadow:0 0 10px rgba(255,252,240,.95),0 0 3px rgba(255,252,240,.9)}
#date b{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.01em}
#date span{font-size:14px;margin-right:8px}
#date i{font-style:normal;font-size:17px;width:34px;height:34px;display:grid;place-items:center;align-self:center;color:#fff;text-shadow:0 1px 2px rgba(80,50,60,.35);border-radius:47% 53% 44% 56%/55% 46% 54% 45%;background:radial-gradient(circle at 35% 30%,#f7c4d2,#e58fac 70%,#d87a9c);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 2px 8px rgba(120,60,80,.2);transition:background 1.5s}
#date i[data-s="1"]{background:radial-gradient(circle at 35% 30%,#a8e0c0,#5fb890 70%,#4aa480)}
#date i[data-s="2"]{background:radial-gradient(circle at 35% 30%,#f6cf8c,#e3a04e 70%,#d48a3c)}
#date i[data-s="3"]{background:radial-gradient(circle at 35% 30%,#d6e2f2,#9db4d6 70%,#8aa2c8)}
#tags{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:9px}
#tags span{font-size:12.5px;font-weight:600;padding:2px 11px 3px 9px;color:#5a4a52;background:rgba(255,252,243,.82);border-radius:var(--hand);border:1.2px solid var(--line);animation:tagIn .9s both;position:relative}
#tags span::before{content:'';display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50% 46% 52% 48%;background:var(--c);vertical-align:1px}
@keyframes tagIn{from{opacity:0;transform:translateX(-10px) rotate(-3deg)}}

/* エリカと吹き出し */
#erika{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:27%;max-width:118px;aspect-ratio:1;z-index:20;cursor:pointer;display:none;animation:bob 4.6s ease-in-out infinite;border-radius:50% 48% 51% 49%/49% 51% 48% 52%;background:radial-gradient(circle at 40% 32%,#fffdf8,#fbf3e4);box-shadow:0 0 0 1.4px var(--line),0 0 0 5px rgba(255,253,246,.9),0 0 0 6.3px rgba(110,84,76,.25),3px 6px 16px rgba(80,60,40,.25);overflow:hidden}
#erika.ready{display:block}
#erika::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 14px rgba(190,150,120,.35),inset 0 0 3px rgba(120,90,70,.4);pointer-events:none}
#erika img{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;opacity:0;transition:opacity .28s;mix-blend-mode:multiply}
#erika img.on{opacity:1}
@keyframes bob{50%{transform:translateY(-3px) rotate(-1.2deg)}}
#bubble{position:absolute;left:min(22%,96px);right:64px;bottom:calc(env(safe-area-inset-bottom) + min(27vw,118px) + 22px);z-index:21;opacity:0;transform:translateY(8px) scale(.94);transform-origin:8% 100%;transition:opacity .45s,transform .55s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#bubble.show{opacity:1;transform:none;pointer-events:auto}
#bubble p{font-size:14.5px;line-height:1.72;font-weight:600;letter-spacing:.02em;padding:11px 15px 12px;background:#fffdf5;border:1.5px solid var(--line);border-radius:var(--hand2);box-shadow:2px 3px 0 rgba(120,90,70,.1),0 6px 18px rgba(90,70,50,.14);position:relative}
#bubble p::after{content:'';position:absolute;left:22px;bottom:-9px;width:15px;height:15px;background:#fffdf5;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:skewX(28deg) rotate(-38deg);border-radius:0 0 0 5px}

/* ボタン */
#btns{position:absolute;right:7px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:7px;z-index:22;transform-origin:100% 100%;transition:opacity 1.2s,transform .6s cubic-bezier(.3,1.3,.5,1)}
#btns.idle{opacity:.42;transform:scale(.8)}
#btns.idle small{opacity:0}
#btns button{width:46px;height:50px;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;display:grid;justify-items:center;align-content:start;position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#btns button::before{content:'';position:absolute;left:4px;top:0;width:38px;height:38px;border-radius:46% 54% 48% 52%/54% 47% 53% 46%;background:radial-gradient(circle at 36% 30%,rgba(255,254,248,.97),rgba(255,250,236,.86));border:1.3px solid var(--line);box-shadow:1px 2px 0 rgba(120,90,70,.1),0 3px 10px rgba(90,70,50,.14)}
#btns button:nth-child(2n)::before{border-radius:54% 46% 53% 47%/46% 54% 45% 55%}
#btns button:active{transform:scale(.88) rotate(-4deg)}
#btns svg{position:relative;width:26px;height:26px;margin-top:6px;fill:none;stroke:#6a5650;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#btns small{position:relative;font-size:9.5px;font-weight:600;line-height:1;margin-top:8px;color:#5a4a52;text-shadow:0 0 4px #fffaf0,0 0 2px #fffaf0,0 0 6px #fffaf0;white-space:nowrap}
#btns button.off svg{opacity:.34}
#btns button.off::after{content:'';position:absolute;left:9px;top:18px;width:28px;height:1.6px;background:#8a6e66;transform:rotate(-38deg);border-radius:2px}
#bSpeed[data-i="0"]::before{background:radial-gradient(circle at 36% 30%,#fff,#e6f1e2)}
#bSpeed[data-i="2"]::before{background:radial-gradient(circle at 36% 30%,#fff,#fbe6c9)}
#bSpeed[data-i="3"]::before{background:radial-gradient(circle at 36% 30%,#fff,#f9cfd6)}
#bSpeed[data-i="3"] svg path:first-of-type{animation:spin 1s linear infinite;transform-origin:16px 17px}
#bSpeed[data-i="2"] svg path:first-of-type{animation:spin 2.4s linear infinite;transform-origin:16px 17px}
@keyframes spin{to{transform:rotate(360deg)}}
#bZukan.ping::before{animation:ping 1.3s}
@keyframes ping{30%{box-shadow:0 0 0 9px rgba(234,163,184,.5);background:#fde3ea}}

/* めくる紙 */
#sheet{position:absolute;left:0;right:0;bottom:0;height:80%;z-index:40;background:#fbf6ea;border-radius:26px 30px 0 0/22px 26px 0 0;border-top:1.5px solid var(--line);box-shadow:0 -10px 40px rgba(80,60,40,.25);transform:translateY(105%);transition:transform .55s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column}
#sheet.open{transform:none}
#sheet.plant{height:74%}
#sheet::before{content:'';position:absolute;left:50%;top:9px;width:44px;height:4px;margin-left:-22px;border-radius:4px;background:rgba(120,90,80,.25)}
#close{position:absolute;right:14px;top:14px;z-index:2;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:#fffdf5;border:1.3px solid var(--line);border-radius:var(--hand);padding:4px 13px 5px;cursor:pointer}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 20px calc(env(safe-area-inset-bottom) + 30px);flex:1}
#sheet h2{font-family:'Kaisei Decol',serif;font-size:21px;font-weight:700;letter-spacing:.04em;margin:2px 70px 8px 0;line-height:1.35;color:#5a4650}
#sheet h3{font-family:'Kaisei Decol',serif;font-size:14.5px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:8px;color:#6a5460}
#sheet h3::after{content:'';flex:1;height:5px;border-radius:5px;background:linear-gradient(90deg,rgba(234,163,184,.5),rgba(134,207,220,.38),transparent)}
#sheet canvas{display:block}
.note{font-size:12.5px;line-height:1.85;color:#7a6860}
.note s{opacity:.55}
.phead{display:flex;gap:14px;align-items:flex-end}
.phead>canvas{flex:none;background:radial-gradient(ellipse at 50% 60%,#fffdf6,#f6eeda);border-radius:var(--hand2);border:1.3px solid var(--line);box-shadow:2px 3px 0 rgba(120,90,70,.08)}
.pinfo{flex:1;min-width:0}
.meta{font-size:13px;line-height:1.85;margin-bottom:10px}
.meta b{font-size:16px;font-family:'Kaisei Decol',serif;color:#d0708e;margin:0 1px}
button.ink{font:inherit;font-size:13px;font-weight:600;color:#6a4650;background:linear-gradient(180deg,#fde9ee,#f9d5de);border:1.3px solid rgba(160,90,110,.45);border-radius:var(--hand);padding:7px 16px 8px;cursor:pointer;box-shadow:1px 2px 0 rgba(140,80,100,.14)}
button.ink:disabled{opacity:.55}
button.ink.quiet{display:block;margin:30px auto 0;background:none;border-color:var(--line);color:#8a7870;font-size:12px;box-shadow:none}
.genes{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;margin-top:18px}
.gene{display:grid;grid-template-columns:5.6em 1fr auto;align-items:center;gap:0 7px;font-size:11.5px;min-height:20px}
.gene span{color:#7a6860;white-space:nowrap}
.gene i{height:8px;border-radius:8px 5px 7px 4px;background:rgba(150,125,110,.16);overflow:hidden;min-width:30px}
.gene em{display:block;height:100%;border-radius:8px 6px 9px 5px;opacity:.92}
.gene b{font-size:11.5px;font-weight:600;min-width:2.6em;text-align:right;color:#5a4a52;white-space:nowrap}
.gene b.wide{grid-column:2/4;text-align:left;font-size:12px}
.fam{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kin{display:grid;justify-items:center;font-size:11px;line-height:1.45;text-align:center;min-width:64px}
.kin canvas,.nothumb{width:52px;height:52px}
.kin small{color:#9a8880;font-size:10.5px}
.dots{color:#b0a096}
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:14px}
.zcard{display:grid;justify-items:center;text-align:center;background:#fffdf6;border:1.2px solid var(--line);border-radius:var(--hand2);padding:6px 4px 9px;box-shadow:2px 3px 0 rgba(120,90,70,.07);transform:rotate(-.6deg)}
.zcard:nth-child(3n+2){transform:rotate(.7deg)}.zcard:nth-child(4n){transform:rotate(-1.1deg)}
.zcard.star{background:#fff6f3;border-color:rgba(190,110,130,.5)}
.zcard canvas{max-width:100%}
.zname{font-size:12px;font-weight:600;line-height:1.4;min-height:1.4em;outline:none;padding:1px 4px;border-radius:6px;-webkit-user-select:text;user-select:text}
.zname:focus{background:#fdeef2}
.zcard small{font-size:10px;color:#9a8880;line-height:1.4}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:#9a8880;margin:2px 6px 6px}
.legend,.prefs{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:#7a6860;margin-top:5px}
.legend i,.prefs i{display:inline-block;width:9px;height:9px;border-radius:50% 44% 52% 46%;margin-right:4px;vertical-align:-1px}
.prefs i{width:16px;height:16px;border:1px solid var(--line);vertical-align:-4px}
.diary p{font-size:12.5px;line-height:1.8;padding:6px 0;border-bottom:1px dashed rgba(120,90,80,.2)}
.diary b{font-family:'Kaisei Decol',serif;color:#d0708e;margin-right:8px;font-size:12px}

/* 扉 */
#title{position:absolute;inset:0;z-index:55;background:var(--paper) url(title.jpg) center/cover no-repeat;display:flex;justify-content:center;transition:opacity 1.7s ease,transform 2.4s ease;cursor:pointer}
#title.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.tt{margin-top:calc(env(safe-area-inset-top) + 11vh);text-align:center;color:#5a4650;text-shadow:0 0 18px #fffdf4,0 0 8px #fffdf4,0 0 3px #fffdf4;animation:ttIn 1.6s .2s both}
.tt p{font-size:13.5px;font-weight:600;letter-spacing:.34em;margin-bottom:10px;color:#c8688a}
.tt h1{font-family:'Kaisei Decol',serif;font-weight:700;font-size:min(13.5vw,58px);line-height:1.22;letter-spacing:.1em}
.tt span{display:block;margin-top:16px;font-size:12.5px;font-weight:600;line-height:1.9;letter-spacing:.06em}
@keyframes ttIn{from{opacity:0;transform:translateY(14px)}}

</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="date"><b id="yr">1</b><span>年目</span><i id="ss" data-s="0">春</i></div>
    <div id="tags"></div>
  </div>
  <div id="erika"></div>
  <div id="bubble"><p></p></div>
  <nav id="btns">
    <button id="bTalk" aria-label="実況"><svg viewBox="0 0 32 32"><path d="M6 9c0-2 1.6-3.4 3.6-3.4h12.8c2 0 3.6 1.4 3.6 3.4v8.4c0 2-1.6 3.4-3.6 3.4h-7.2l-5.4 4.6.6-4.6h-.8c-2 0-3.6-1.4-3.6-3.4z"/><path d="M11.5 11.8h9M11.5 15.4h6"/></svg><small>実況</small></button>
    <button id="bSound" class="off" aria-label="音"><svg viewBox="0 0 32 32"><path d="M12.5 23.5V9.2l11-2.4v13.4"/><ellipse cx="9.6" cy="23.6" rx="3.2" ry="2.5"/><ellipse cx="20.6" cy="20.4" rx="3.2" ry="2.5"/></svg><small>音</small></button>
    <button id="bHist" aria-label="年表"><svg viewBox="0 0 32 32"><path d="M5 24.5c4-1 5-9.5 9-9.5s3.6 5 7 5 3.6-10 6.4-12"/><path d="M5 27.5h22.5"/></svg><small>年表</small></button>
    <button id="bZukan" aria-label="図鑑"><svg viewBox="0 0 32 32"><path d="M16 9.4c-2.6-2-6-2.6-10-2.2v17c4-.4 7.4.2 10 2.2 2.6-2 6-2.6 10-2.2v-17c-4-.4-7.4.2-10 2.2zM16 9.4v17"/><circle cx="21.2" cy="14.4" r="1.7"/><path d="M21.2 16.4v3.6"/></svg><small>図鑑</small></button>
    <button id="bSpeed" data-i="1" aria-label="速さ"><svg viewBox="0 0 32 32"><circle cx="16" cy="17" r="9.6"/><path d="M16 17l4.6-5.4M16 5v2.6M13.4 4.6h5.2"/></svg><small>ふつう</small></button>
  </nav>
  <section id="sheet"><button id="close" aria-label="とじる">とじる</button><div id="sheetBody"></div></section>
  <div id="title"><div class="tt"><p>エリカの観察日記</p><h1>うつろいの<br>花畑</h1><span>だれも手を入れない花畑が、<br>虫と風と天気にまかせて変わっていきます</span></div></div>
  <div id="paper"></div>
</div>
<script>
(()=>{
'use strict';
// ===== 00-util.js =====
// ───────────────────────── util ─────────────────────────
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const hump = (a, b, x) => { const t = (x - a) / (b - a); return t <= 0 || t >= 1 ? 0 : Math.sin(Math.PI * t); };

function RNG(seed) { this.s = seed >>> 0; }
RNG.prototype.next = function () {
  let t = (this.s = (this.s + 0x6d2b79f5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
RNG.prototype.range = function (a, b) { return a + (b - a) * this.next(); };
RNG.prototype.int = function (n) { return Math.floor(this.next() * n); };
RNG.prototype.chance = function (p) { return this.next() < p; };
RNG.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
RNG.prototype.gauss = function () {
  let u = 0, v = 0;
  while (u === 0) u = this.next();
  v = this.next();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
};

const hueWrap = (h) => ((h % 360) + 360) % 360;
const hueDist = (a, b) => { const d = Math.abs(hueWrap(a) - hueWrap(b)); return d > 180 ? 360 - d : d; };
const hueLerp = (a, b, t) => { let d = hueWrap(b) - hueWrap(a); if (d > 180) d -= 360; if (d < -180) d += 360; return hueWrap(a + d * t); };
const gaussHue = (h, c, sig) => { const d = hueDist(h, c); return Math.exp(-(d * d) / (2 * sig * sig)); };
const hsl = (h, s, l, a = 1) => `hsla(${hueWrap(h).toFixed(1)},${(clamp(s) * 100).toFixed(1)}%,${(clamp(l) * 100).toFixed(1)}%,${a})`;

// integer hash → 0..1 (visual jitter that must not consume sim rng)
const hash1 = (n) => { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n ^= n >>> 16; return (n >>> 0) / 4294967296; };
const hash2 = (a, b) => hash1((a * 73856093) ^ (b * 19349663));
function vnoise(x, seed = 0) { const i = Math.floor(x), f = x - i; const u = f * f * (3 - 2 * f); return lerp(hash2(i, seed), hash2(i + 1, seed), u); }
function vnoise2(x, y, seed = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const h = (a, b) => hash1(((a * 73856093) ^ (b * 19349663) ^ (seed * 83492791)) | 0);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v);
}
const fbm = (x, seed = 0) => vnoise(x, seed) * 0.55 + vnoise(x * 2.1, seed + 7) * 0.3 + vnoise(x * 4.3, seed + 13) * 0.15;

// ───────────────────────── 透視 ─────────────────────────
// x は「画面の左右のどこか」(0..1)、z は奥行き (0=奥, 1=手前)。
// 奥ほど同じ画面幅に広い地面が写るので、株は小さく、数は多く、間隔は詰まって見える。
// 距離を測るときは必ず地面の座標 (wx, wz) に直す。単位は「手前の画面幅」。
const PERS = { PK: 7, DN: 3.1 };
const persA = (z) => 1 + PERS.PK * (1 - z);
const toWX = (x, z) => (x - 0.5) * persA(z);
const toWZ = (z) => z * PERS.DN;
const fromW = (wx, wz) => { const z = wz / PERS.DN; return [0.5 + wx / persA(z), z]; };

// ───────────────────────── 花畑の地形 ─────────────────────────
// x: 0(左)..1(右)  z: 0(奥)..1(手前)
const SITE = {
  hill: { x: 0.2, z: 0.6, r: 0.25 },
  shade: { x: 0.8, z: 0.2, r: 0.19 },
  brookX(z) { const f = 1 / persA(z), zw = z * PERS.DN; return 0.4 + 0.16 * f + 0.19 * f * Math.sin(zw * 8.4 + 0.6) + 0.05 * f * Math.sin(zw * 19 + 2); }, // 蛇行の幅は地面では一定 → 奥ほど小さく見える
  brookW(z) { return (0.066 / persA(z)) * (1 + 0.25 * Math.sin(z * PERS.DN * 4 + 2)); },
  elev(x, z) { const dx = x - this.hill.x, dz = (z - this.hill.z) * 1.15; return Math.exp(-(dx * dx + dz * dz) / (this.hill.r * this.hill.r)); },

function spActivity(sp, t) {
  switch (sp) {

function spAttraction(sp, st, g) {
  const white = G.white(g), form = G.form(g), arr = G.arr(g);

  if (sp === 'bee') {

    if (!white && hueDist(g.h, 2) < 24 && g.s > 0.4) col *= 0.3; // 赤は見えにくい

  } else if (sp === 'fly') {
    col = Math.max(0.3 + 0.75 * smooth(0.6, 0.9, g.l), 1.05 * gaussHue(g.h, st.pref, st.sig) * (0.4 + 0.6 * g.s)) * (white ? 0.8 : 1); // 明るい色ならなんでも。とくに黄色
    shp = (1.35 - g.sz) * (form === 'open' ? 1 : form === 'funnel' ? 0.6 : 0.3) * (0.7 + 0.5 * g.fn) * (arr === 'lace' ? 1.6 : arr === 'plume' ? 1.4 : arr === 'umbel' ? 1 : 0.75); // 口の短いアブは、浅い小花の集まりへ
  } else {
    col = (0.2 + 0.9 * smooth(0.62, 0.92, g.l) + 0.45 * gaussHue(g.h, st.pref, st.sig)) * (white ? 0.85 : 1); // 夕闇に浮かぶ淡い色。うす紅や藤色も
    shp = (form === 'funnel' ? 2 : form === 'tulip' ? 1.6 : form === 'bell' ? 1.1 : 0.45) * (0.5 + 1.2 * g.ne) * (arr === 'spray' ? 1.2 : 1); // 筒の深い花
  }

}

      if (r.chance(y < 4 ? 0 : 0.13)) { w.ev.push('storm'); sched.push({ tick: 42 + r.int(46), kind: 'storm', power: r.range(0.55, 1) }); }

        if (r.chance(last.bins[mb] > 0.42 ? 0.3 : last.bins[mb] > 0.3 ? 0.1 : 0.02)) { w.ev.push('aphids'); sched.push({ tick: 30 + r.int(26), kind: 'aphids', bin: mb }); }

  buildGrid() {

  gridAdd(p) { const { cell, XH, NX, NZ, cells } = this.grid; cells[clamp((p.wz / cell) | 0, 0, NZ - 1) * NX + clamp(((p.wx + XH) / cell) | 0, 0, NX - 1)].push(p); }

    const { cell, XH, NX, NZ, cells } = this.grid, c = Math.ceil(rad / cell);
    const cx = clamp(((wx + XH) / cell) | 0, 0, NX - 1), cz = clamp((wz / cell) | 0, 0, NZ - 1);

  newYear() {
    const r = this.rng;
    this.tick = 0;
    this.rollWeather();

  // ── 1 tick ──
  step() {

        const P = Math.pow(p.light, 1 - 0.55 * g.lw) * (0.8 + 0.2 * g.lw) * (1 - 0.1 * g.lc * g.lw) * (1 - 0.07 * smooth(0.55, 0.85, g.lh));

        p.R += gain * p.bio - 0.22 * g.ht * g.ht * p.bio - 0.06 * g.ht * p.bio; // 茎を高く伸ばすほど、花と種に回せる栄養が減る

    this.bloomers = bloomers;
    if (tk % 5 === 0) { // それぞれの虫の「お気に入り」：めずらしくても好みに合う花は見つけてもらえる
      this.fav = {};
      for (const k of SP_KEYS) this.fav[k] = bloomers.slice().sort((a, b) => b.attr[k] * b.hab[k] - a.attr[k] * a.hab[k]).slice(0, 14);

      const tt = t + 0.03 * w.temp;
      for (const a of this.agents) {

        }

      }

    this.tick++;
    if (this.tick === Math.round(TICKS * 0.08)) this.emit('season', { s: 0 });
    else if (this.tick === Math.round(TICKS * 0.33)) this.emit('season', { s: 1 });
    else if (this.tick === Math.round(TICKS * 0.58)) this.emit('season', { s: 2 });
    else if (this.tick === w.onset) this.emit('season', { s: 3 });
    if (this.tick >= TICKS) this.endYear();
  }

  updateLight() {
    this.buildGrid();
    const tk = this.tick;
    for (const p of this.plants) {
      if (p.dead || tk < p.sprout) continue;
      const h = p.g.ht * p.bio * (p.lodged ? 0.3 : 1);
      let sh = 0;
      this.near(p.wx, p.wz, 0.2, (q, d) => { if (q !== p && tk >= q.sprout) { const dh = q.g.ht * q.bio * (q.lodged ? 0.3 : 1) - h - 0.12; if (dh > 0) sh += dh * (1 - d / 0.2) * (0.5 + 0.5 * q.g.lw); } });
      p.light = SITE.sun(p.x, p.z) / (1 + 1.5 * sh);
    }
  }

  kill(p, cause) { p.dead = 1; p.cause = cause; p.state = 3; p.open = 0; this.yr.died[cause] = (this.yr.died[cause] || 0) + 1; this.emit('die', { plant: p, cause }); }

  doEvent(e) {
    const r = this.rng;
    if (e.kind === 'frost') {
      let n = 0;
      for (const p of this.plants) {
        if (p.dead || this.tick < p.sprout) continue;
        const c = p.g.cd;
        if (p.state === 1 && c < 0.6) { p.frost = 1; p.state = 3; p.open = 0; p.fert = []; n++; }
        else if (p.age === 0 && r.chance(0.5 * (1 - c * 2.2))) { this.kill(p, 'frost'); n++; }
        else if (c < 0.45) { p.bio *= 0.75; }
      }
      this.yr.frostbit = n;
      this.emit('event', { kind: 'frost', n });
    } else if (e.kind === 'storm') {
      let n = 0;
      this.flags.stormNow = this.tick + 5;
      for (const p of this.plants) {
        if (p.dead || this.tick < p.sprout) continue;
        const h = p.g.ht * p.bio;
        const pr = e.power * Math.pow(h, 1.5) * 2.1 * SITE.expo(p.x, p.z) * (1 - 0.3 * p.g.br) * (1 + 0.4 * clamp(G.cost(p.g) / 3.2));
        if (r.chance(pr)) { p.lodged = 1; n++; if (p.state === 1) { p.state = 2; p.ripen = 6; } p.fert.length = Math.floor(p.fert.length * 0.35); p.R *= 0.5; }
      }
      this.yr.lodged = n;
      this.emit('event', { kind: 'storm', n, power: e.power });
    } else if (e.kind === 'longrain') {
      this.flags.rainNow = this.tick + e.len;
      this.emit('event', { kind: 'longrain' });
    } else if (e.kind === 'aphids') {
      let n = 0;
      for (const p of this.plants) if (!p.dead && this.tick >= p.sprout && G.hueBin(p.g) === e.bin && r.chance(0.8)) { p.aphid = 1; p.R *= 0.3; n++; }
      this.yr.aphid = n; this.yr.aphidBin = e.bin;
      this.emit('event', { kind: 'aphids', bin: e.bin, n });
    }
  }

  disperse(p, winter) {

    if (p.lodged) n = Math.round(n * 0.5);
    if (winter) n = Math.round(n * 0.25); // 冬に間に合わなかった

    const snap = { g, y: this.year, gen: p.gen };

        if (x < 0.01 || x > 0.99 || z < 0.02 || z > 0.995) continue;
        this.bank.push({ g: cg, x, z, gen: Math.max(p.gen, dad.gen) + 1, line: p.line, momG: g, dadG: dad.g, anc, age: 0, w: 0.4 + 1.6 * cg.sd });

  }

  // ── 年の終わり：記録をつけ、冬を越す ──
  endYear() {

    // 虫の数と好みが、花に合わせて動く

      const s = this.sp[k];
      const target = clamp(s.food / (FOOD0 * s.mul), 0.8, 9.5); rec.food[k] = Math.round(s.food); // 蜜の量に見合った数へ
      s.pop = lerp(s.pop, target, 0.4) * Math.exp(r.gauss() * 0.16);
      s.pop = clamp(s.pop + (SPECIES[k].pop - s.pop) * 0.16, 1.6, 9.5); // まわりの野山からも少し飛んでくる
      if (s.visits > 20 && k !== 'moth') {
        let sx = 0, sy = 0; for (let b = 0; b < 12; b++) { sx += Math.cos((b * 30 * Math.PI) / 180) * s.bins[b]; sy += Math.sin((b * 30 * Math.PI) / 180) * s.bins[b]; }
        if (sx * sx + sy * sy > 1) { const m = hueWrap((Math.atan2(sy, sx) * 180) / Math.PI); s.pref = hueLerp(s.pref, m, 0.035); }
        s.pref = hueLerp(s.pref, SPECIES[k].pref, 0.012); // 生まれつきの好みへ少し戻る

      }
    }

    for (const p of this.plants) {
      if (p.dead || p.g.pe <= 0.5) continue;
      const pr = 0.62 - 1.5 * Math.max(0, w.sev - (0.15 + 0.75 * p.g.cd)) - (p.age >= 3 ? 0.2 * (p.age - 2) : 0) - (p.lodged ? 0.15 : 0);
      if (r.chance(pr)) { p.age++; next.push(p); }
    }
    rec.overwinter = next.length;
    this.plants = next;
    this.bank = this.bank.filter((s) => r.chance(1 - 0.6 * Math.max(0, w.sev - 0.5 - 0.5 * s.g.cd)));
    if (this.bank.length > 12000) { for (let i = this.bank.length - 1; i > 0; i--) { const j = r.int(i + 1); [this.bank[i], this.bank[j]] = [this.bank[j], this.bank[i]]; } this.bank.length = 12000; }

  }

  census() {
    const w = this.w, ps = this.plants;
    const bins = new Array(13).fill(0), zb = { hill: new Array(13).fill(0), shade: new Array(13).fill(0), brook: new Array(13).fill(0), field: new Array(13).fill(0) };
    const TR = ['sz', 'ht', 'fn', 'dr', 'cd', 'bt', 'lw', 'pe', 'l', 'dbl', 'sd', 'ne'];
    const m = {}, ms = {}, v = {}; for (const k of TR) { m[k] = 0; ms[k] = 0; v[k] = 0; }
    let n = 0, fl = 0, seeds = 0, nb = 0, dbl = 0, per = 0, pet = 0;
    const lines = {}, binSeeds = new Array(13).fill(0), binN = new Array(13).fill(0), names = {}, forms = {}, arrs = {};
    for (const p of ps) {
      const g = p.g; n++;
      lines[p.line] = (lines[p.line] || 0) + 1;
      for (const k of TR) { m[k] += g[k]; ms[k] += g[k] * p.seeds; v[k] += g[k] * g[k]; }
      seeds += p.seeds;
      const b = G.hueBin(g); binSeeds[b] += p.seeds; binN[b]++;
      if (p.bloomed) { nb++; const c = p.nOpen; fl += c; bins[b] += c; zb[SITE.zone(p.x, p.z)][b] += c; if (G.rings(g) > 1) dbl++; if (g.pe > 0.5) per++; const ff = G.form(g), aa = G.arr(g); forms[ff] = (forms[ff] || 0) + 1; arrs[aa] = (arrs[aa] || 0) + 1; pet += G.petals(g); const nm = colorName(g); names[nm] = (names[nm] || 0) + c; }
    }
    const sel = {};
    for (const k of TR) { const mean = m[k] / Math.max(1, n), sd = Math.sqrt(Math.max(1e-6, v[k] / Math.max(1, n) - mean * mean)); sel[k] = seeds > 20 ? +((ms[k] / seeds - mean) / sd).toFixed(2) : 0; m[k] = +mean.toFixed(3); }
    for (let b = 0; b < 13; b++) bins[b] = +(bins[b] / Math.max(1, fl)).toFixed(3);
    const zoneTop = {};
    for (const z in zb) { let tb = -1, tv = 0, tot = 0; for (let b = 0; b < 13; b++) { tot += zb[z][b]; if (zb[z][b] > tv) { tv = zb[z][b]; tb = b; } } zoneTop[z] = tot > 12 ? [tb, +(tv / tot).toFixed(2)] : null; }
    // どの色が、どの虫にいちばん通われたか／種をよく残したか
    const binVis = []; for (let b = 0; b < 13; b++) { let top = null, tv = 0; for (const k of SP_KEYS) if (this.sp[k].bins[b] > tv) { tv = this.sp[k].bins[b]; top = k; } binVis.push(top); }
    const binFit = binN.map((c, b) => (c > 4 && seeds > 0 ? +((binSeeds[b] / c) / (seeds / Math.max(1, n))).toFixed(2) : null));
    let topName = null, tn = 0; for (const k in names) if (names[k] > tn) { tn = names[k]; topName = k; }
    const pops = {}, prefs = {}, vis = {}; for (const k of SP_KEYS) { pops[k] = +this.sp[k].pop.toFixed(2); prefs[k] = Math.round(this.sp[k].pref); vis[k] = this.sp[k].visits; }
    return {
      forms: Object.fromEntries(Object.entries(forms).map(([k2, v2]) => [k2, +(v2 / Math.max(1, nb)).toFixed(2)])), arrs: Object.fromEntries(Object.entries(arrs).map(([k2, v2]) => [k2, +(v2 / Math.max(1, nb)).toFixed(2)])),
      y: this.year, n, nb, fl, seeds, bins, m, sel, zoneTop, binVis, binFit, topName, topShare: +(tn / Math.max(1, fl)).toFixed(2),
      dbl: +(dbl / Math.max(1, nb)).toFixed(2), per: +(per / Math.max(1, nb)).toFixed(2), pet: +(pet / Math.max(1, nb)).toFixed(1),
      rain: +w.rain.toFixed(2), temp: +w.temp.toFixed(2), sev: +w.sev.toFixed(2), climate: +w.climate.toFixed(2), ev: w.ev.slice(), pops, prefs, vis, lines, yr: this.yr, food: {},
    };
  }

  // いま咲いている花のようす（実況用）
  nowStats() {
    const bins = new Array(13).fill(0), names = {}; let fl = 0, n = 0;
    for (const p of this.plants) if (!p.dead && p.state === 1) { n++; fl += p.nOpen; bins[G.hueBin(p.g)] += p.nOpen; const nm = colorName(p.g); names[nm] = (names[nm] || 0) + p.nOpen; }
    let top = null, tv = 0; for (const k in names) if (names[k] > tv) { tv = names[k]; top = k; }
    return { n, fl, bins, top, share: fl ? tv / fl : 0, kinds: Object.keys(names).length };
  }

  // ── 保存（年のはじめの状態だけ） ──
  save() {
    const gt = [], gi = new Map();
    const gid = (g) => { if (!g) return -1; let i = gi.get(g); if (i === undefined) { i = gt.length; gi.set(g, i); gt.push([Math.round(g.h * 10) / 10].concat(GENES.map((k) => Math.round(g[k] * 1000) / 1000))); } return i; };
    const at = [], ai = new Map();
    const aid = (anc) => { let i = ai.get(anc); if (i === undefined) { i = at.length; ai.set(anc, i); at.push(anc.map((s) => [gid(s.g), s.y, s.gen])); } return i; };
    const pk = (o) => [gid(o.g), +o.x.toFixed(4), +o.z.toFixed(4), o.gen, o.line, gid(o.momG), gid(o.dadG), aid(o.anc)];
    return {
      v: 2, seed0: this.seed0, rs: this.rng.s, year: this.year, nextId: this.nextId,
      c: [this.cPeriod, this.cPhase, this.cDrift, this.rPeriod, this.rPhase],
      sp: Object.fromEntries(SP_KEYS.map((k) => [k, [this.sp[k].pop, this.sp[k].pref]])),
      plants: this.plants.map((p) => pk(p).concat([p.id, p.born, p.age])), bank: this.bank.filter((s, i) => this.bank.length <= 2200 || hash1(i * 31 + this.year) < 2200 / this.bank.length).map((s) => pk(s).concat([s.age, +s.w.toFixed(2)])),
      gt, at, hist: this.hist, seen: this.seen, lines: this.lines,
    };
  }
  static load(d) {
    const s = new Sim(d.seed0);
    s.rng.s = d.rs; s.year = d.year; s.nextId = d.nextId;
    [s.cPeriod, s.cPhase, s.cDrift, s.rPeriod, s.rPhase] = d.c;
    for (const k of SP_KEYS) if (d.sp[k]) { s.sp[k].pop = d.sp[k][0]; s.sp[k].pref = d.sp[k][1]; }
    const gt = d.gt.map((a) => { const g = { h: a[0] }; GENES.forEach((k, i) => (g[k] = a[i + 1])); return g; });
    const at = d.at.map((a) => a.map((e) => ({ g: gt[e[0]], y: e[1], gen: e[2] })));
    const un = (a) => ({ g: gt[a[0]], x: a[1], z: a[2], wx: toWX(a[1], a[2]), wz: toWZ(a[2]), gen: a[3], line: a[4], momG: a[5] < 0 ? null : gt[a[5]], dadG: a[6] < 0 ? null : gt[a[6]], anc: at[a[7]] });
    s.hist = d.hist; s.seen = d.seen; s.lines = d.lines;
    // 年のはじめの手前（種と越冬株）に戻してから newYear をやり直す
    s.bank = d.bank.map((a) => Object.assign(un(a), { age: a[8], w: a[9] }));
    s.plants = [];
    const born = d.plants.map((a) => Object.assign(un(a), { id: a[8], born: a[9], age: a[10] }));
    s._restore = born;
    return s;
  }
  resume() { // load のあとに 1 回だけ呼ぶ
    const born = this._restore; delete this._restore;
    this.tick = 0;
    // 保存時点の株をそのまま置く（芽生えのくじはもう済んでいる）
    const keepBank = this.bank; this.bank = [];
    this.w = { temp: 0 };
    this.plants = born;
    const yr = this.year; const r0 = this.rng.s;
    this.rollWeather();
    for (const k of SP_KEYS) { const s = this.sp[k]; s.food = 0; s.act = 0; s.visits = 0; s.bins.fill(0); s.mul = 1; }
    if (this.flags.butterflies) this.sp.butterfly.mul = 2.6;
    if (this.flags.fewbugs) { this.sp.bee.mul = 0.3; this.sp.fly.mul = 0.35; this.sp.butterfly.mul = 0.5; }
    this.flags.bird = 0; this.w.ev = this.w.ev.filter((e) => e !== 'bird');
    for (const p of this.plants) { const q = this.mkPlant(p); p.hab = q.hab; this.nextId--; this.resetPlant(p); }
    this.buildGrid(); this.bank = keepBank;

// ── 吹き出しと実況 ──
const Talk = { q: [], cur: null, endAt: 0, gapUntil: 3, on: true, cool: {}, coolY: {}, diary: [], el: null, said: 0, lastIdle: 0 };
const now = () => performance.now() / 1000;
function say(text, o = {}) {
  if (!text) return;
  const pri = o.pri || 1, tp = o.topic;
  if (tp && Talk.cool[tp] && now() < Talk.cool[tp]) return;
  if (tp) Talk.cool[tp] = now() + (o.cool || 45);
  if (o.diary !== false && o.year) { Talk.diary.push([o.year, text]); if (Talk.diary.length > 160) Talk.diary.shift(); }
  if (!Talk.on && !o.force) return;
  Talk.q.push({ text, pri, mood: o.mood || 'calm', exp: now() + (o.ttl || 14), force: o.force });
  if (Talk.q.length > 4) { Talk.q.sort((a, b) => b.pri - a.pri); Talk.q.length = 4; }
}
function talkTick(dt) {
  const t = now(), E = ERIKA;
  E.nextBlink -= dt; E.blink -= dt; if (E.nextBlink < 0) { E.blink = 0.13; E.nextBlink = 2 + Math.random() * 4; }
  E.lookT -= dt; if (E.lookT < 0) { E.look = Math.random() < 0.3 ? 0 : Math.random() * 2 - 0.6; E.lookT = 2 + Math.random() * 4; }
  E.moodT -= dt; if (E.moodT < 0) E.mood = 'calm'; E.hop -= dt * 2.4;
  if (Talk.cur && t > Talk.endAt) { Talk.el.classList.remove('show'); Talk.cur = null; Talk.gapUntil = t + 2.2; }
  if (!Talk.cur && t > Talk.gapUntil && Talk.q.length) {
    Talk.q = Talk.q.filter((m) => m.exp > t); if (!Talk.q.length) return;
    Talk.q.sort((a, b) => b.pri - a.pri); const m = Talk.q.shift();
    Talk.cur = m; Talk.endAt = t + 3.4 + m.text.length * 0.115;
    Talk.el.firstElementChild.textContent = m.text; Talk.el.classList.add('show');
    E.mood = m.mood; E.moodT = Talk.endAt - t; if (m.mood === 'wow' || m.mood === 'happy') E.hop = 1;
  }
}

function onSimEvent(ev, sim) {
  const y = ev.year, base = { year: y };
  if (ev.type === 'newyear') {
    const w = ev.w, e = w.ev;
    if (e.includes('drought')) say('今年は日照りの年です。水をたくさん使う大きな花には、つらい夏になります', { ...base, pri: 3, mood: 'sad', topic: 'ny' + y });
    else if (e.includes('rainy')) say('今年は雨の多い年です。大きな花も、水に困らずのびのび育ちます', { ...base, pri: 3, topic: 'ny' + y });
    else if (e.includes('butterflies')) say('今年はチョウが大発生しています。チョウは赤や桃色の大きな花が好きなんです', { ...base, pri: 3, mood: 'wow', topic: 'ny' + y });
    else if (e.includes('fewbugs')) say('今年は虫が少ないみたいです。よく目立つ花でないと、花粉を運んでもらえません', { ...base, pri: 3, mood: 'sad', topic: 'ny' + y });
    else if (w.temp < -0.7) say('今年は寒い年です。寒さに強い株から、先に芽を出します', { ...base, pri: 2, topic: 'ny' + y });
    else if (w.temp > 0.75) say('今年は暖かい年です。花の咲く時期が、少し早まります', { ...base, pri: 2, topic: 'ny' + y });
    else if ([10, 25, 50, 100, 150, 200, 300, 500].includes(y)) say(`観察をはじめて${y}年目です。最初の花畑とは、もう別の場所みたいです`, { ...base, pri: 2, mood: 'happy', topic: 'ny' + y });
    if (e.includes('bird')) say('鳥が、よその種を落としていきました。見たことのない花が咲くかもしれません', { ...base, pri: 2, topic: 'bird' + y });
  } else if (ev.type === 'event') {
    if (ev.kind === 'storm') say(ev.n > 3 ? `嵐です。${ev.n}株が倒れました。背の高い花ほど、風をまともに受けます` : '嵐です。でも背の低い花ばかりなので、ほとんど倒れませんでした', { ...base, pri: 4, mood: 'wow', topic: 'storm' + y });
    else if (ev.kind === 'frost') say(ev.n > 2 ? `遅霜です。${ev.n}株やられました。早く咲くと虫をひとりじめできますが、これが怖いんです` : '遅霜がおりました。寒さに強い株ばかりで、被害は少しでした', { ...base, pri: 4, mood: 'sad', topic: 'frost' + y });
    else if (ev.kind === 'longrain') say('長雨です。花びらの多い大きな花は、雨で傷みやすいんです。虫もあまり飛べません', { ...base, pri: 3, mood: 'sad', topic: 'lr' + y });
    else if (ev.kind === 'aphids' && ev.n > 4) say(`${BIN_SAY[ev.bin]}花にアブラムシがつきました。同じ色ばかり増えると、こうして狙われます`, { ...base, pri: 3, mood: 'sad', topic: 'aph' + y });
  } else if (ev.type === 'novel') {
    const p = ev.plant; if (!p) return;
    if (ev.kind === 'color') {
      const mc = p.momG ? colorName(p.momG) : null, dc = p.dadG ? colorName(p.dadG) : null;
      let tail = '';
      if (p.g._macro) tail = '。親とはまるで違う色です。突然変異ですね';
      else if (mc && dc && mc !== dc && mc !== ev.name) tail = `。${mc}と${dc}のあいだに生まれた子です`;
      else if (mc && mc !== ev.name) tail = `。親は${mc}でした。少しずつ色がずれてきたんです`;
      say(`おや、はじめて見る${ev.name}の花です${tail}`, { ...base, pri: 3, mood: 'wow', topic: 'novc', cool: 20 });
    } else say(`${ev.name}の花が、はじめて咲きました。${FORM_WHY[ev.key] || ''}`, { ...base, pri: 3, mood: 'wow', topic: 'novf', cool: 20 });
    addSketch(p, ev.kind === 'color' ? `はじめての${ev.name}` : `はじめての${ev.name}`);
  } else if (ev.type === 'record') {
    if (ev.kind === 'sz') say('これまでで一番大きな花が咲きました。よく目立ちますが、水と栄養をたくさん使います', { ...base, pri: 2, mood: 'wow', topic: 'rec', cool: 90 });
    else say('これまでで一番背の高い株です。日なたは取れますが、嵐が来たら心配です', { ...base, pri: 2, topic: 'rec', cool: 90 });
    addSketch(ev.plant, ev.kind === 'sz' ? '一番大きな花' : '一番背の高い株');
  } else if (ev.type === 'extinct') {
    say(`${ev.name}の系統が、とうとう途絶えました。${ev.years}年つづいた血筋でした`, { ...base, pri: 3, mood: 'sad', topic: 'ext' + ev.line });
  } else if (ev.type === 'season') {
    if (ev.s === 3 && (y <= 2 || Math.random() < 0.12)) say('冬です。一年草は種だけ残して枯れます。多年草は根で冬を越します', { ...base, pri: 1, topic: 'winter', cool: 200, diary: false });

  } else if (ev.type === 'yearend') yearReview(ev.rec, sim);

// 1 年をふり返って、いちばん語るべきことを 1 つだけ選ぶ
function yearReview(r, sim) {
  const H = sim.hist, prev = H[H.length - 2], p5 = H[H.length - 6], p10 = H[H.length - 11];
  const c = [], y = r.y, ev = r.ev;
  const add = (score, key, text, mood) => { if (!(Talk.coolY[key] > y - 7)) c.push({ score, key, text, mood }); };
  const S = r.sel || {};
  const dry = ev.includes('drought') || r.rain < -0.4, wet = r.rain > 0.4, storm = ev.includes('storm'), frost = ev.includes('frost');
  const sel = (k, hi, lo) => { const v = S[k] || 0; if (v > 0.33 && hi) add(v * 2.2, k + '+', hi); else if (v < -0.33 && lo) add(-v * 2.2, k + '-', lo); };
  sel('sz', wet ? '今年よく種を残したのは、大きな花でした。雨が多くて、水に困らなかったからです' : ev.includes('butterflies') ? '今年は大きな花がよく種を残しました。大発生したチョウが、大きな花ばかり選んだからです' : '今年は大きな花ほど、虫がよく来て種を残しました',
    dry ? '今年よく種を残したのは、小さな花でした。日照りの年は、水を使わない花が勝ちます' : '今年は小さな花のほうが種を残しました。大きな花は、咲くだけで栄養を使いきったみたいです');
  sel('ht', '背の高い株が、種を多く残しました。まわりより上に出て、日なたを取れたからです', storm ? '嵐で背の高い株が倒れて、低い株ばかりが種を残しました' : '今年は背の低い株が有利でした。茎を伸ばさないぶん、種に栄養を回せます');
  sel('dr', dry ? '乾きに強い株が、日照りを生きのびて種を残しました' : '乾きに強い株が種を増やしました。丘の上まで広がれるからです', wet ? '雨の年は、乾きへの備えがむだになります。備えのない株のほうが、よく育ちました' : null);
  sel('cd', frost ? '遅霜のあと、寒さに強い株だけが花を咲かせられました' : r.temp < -0.3 ? '寒い年でした。寒さに強い株が、種を多く残しました' : null, r.temp > 0.3 ? '暖かい年は、寒さへの備えがいりません。備えを捨てた株が伸びました' : null);
  sel('bt', frost ? '遅霜で早咲きがやられて、遅く咲いた株が種を残しました' : '遅咲きの株が有利でした。夏から秋の虫を、ゆっくり待てたからです', '早咲きの株が、種を多く残しました。ほかの花が咲く前なら、虫をひとりじめできます');
  sel('pe', '多年草が種を増やしました。芽生えからやり直さなくていいぶん、春に早く動けます', r.sev > 0.6 ? '冬が厳しいと、根で越す多年草は枯れてしまいます。種で越す一年草が増えそうです' : '一年草がよく種を残しました。一年で使いきるぶん、種の数が多いんです');
  sel('dbl', '八重に近い花ほど、種を残しました。花びらが多いと、虫の目を引くからです', ev.includes('longrain') ? '長雨で、花びらの多い花が傷みました。すっきりした一重の花が種を残しました' : null);
  sel('fn', '花数の多い株が有利でした。たくさん咲けば、それだけ虫が立ち寄ります', dry ? '花数の少ない株が種を残しました。日照りの年に、たくさんは咲かせられません' : null);
  sel('ne', '蜜の多い花に、虫が通いつめました。蜜を作るのも、ただではないんですけどね', null);
  sel('lw', '葉の広い株がよく育ちました。木かげでも光を集められます', dry ? '葉の細い株が種を残しました。葉が小さいほど、水が逃げません' : null);
  // 色の移り変わりと、その理由
  if (p5 && p5.bins) {
    let ub = -1, uv = 0.11; for (let b = 0; b < 13; b++) { const d = r.bins[b] - p5.bins[b]; if (d > uv) { uv = d; ub = b; } }
    if (ub >= 0) { const sp = r.binVis && r.binVis[ub]; add(1 + uv * 5, 'col' + ub, `この5年で、${BIN_SAY[ub]}花が増えました。${sp ? `${SP_NAME[sp]}がいちばん通っている色です。${SP_NAME[sp]}は${SP_LIKES[sp]}が好きなんです` : '虫の好みに合ったのでしょう'}`, 'happy'); }
    for (const k of SP_KEYS) { const a = r.pops[k], b = p5.pops[k]; if (a > b * 1.7 && a > 4) add(1.4, 'pop+' + k, `${SP_NAME[k]}が増えてきました。好みの花が増えて、蜜に困らなくなったからです`); else if (a < b * 0.55 && b > 3.5) add(1.4, 'pop-' + k, `${SP_NAME[k]}が減ってきました。${SP_LIKES[k]}が、少なくなったからです`, 'sad'); }
  }
  if (r.topShare > 0.44 && r.topName) add(1.2 + r.topShare, 'dom' + r.topName, `花畑の${Math.round(r.topShare * 10)}割が${r.topName}です。増えすぎると、同じ虫を取り合って、かえって苦しくなります`);
  const zt = r.zoneTop || {}, zk = ['hill', 'shade', 'brook'].filter((k) => zt[k] && zt[k][1] > 0.42);
  for (let i = 0; i < zk.length; i++) for (let j = i + 1; j < zk.length; j++) if (zt[zk[i]][0] !== zt[zk[j]][0]) {
    const why = zk.includes('hill') ? 'チョウは日なたの丘が好きで、アブは水辺が好き。通う虫が違うからです' : '場所ごとに、通ってくる虫が違うからです';
    add(1.7, 'zone', `${ZONE_NAME[zk[i]]}は${BIN_SAY[zt[zk[i]][0]]}花、${ZONE_NAME[zk[j]]}は${BIN_SAY[zt[zk[j]][0]]}花。場所で色が分かれてきました。${why}`, 'happy');
  }
  if (p10 && Math.abs(r.climate - p10.climate) > 0.33) add(1.3, 'clim', r.climate > p10.climate ? 'この10年、だんだん暖かくなっています。寒さへの備えが、少しずついらなくなってきました' : 'この10年、だんだん涼しくなっています。寒さに強い株が、じわじわ増えています');
  if (prev && r.nb < prev.nb * 0.5 && prev.nb > 40) add(2.4, 'crash', '今年は、咲けた花が少ない年でした。でも土の中では、種が来年を待っています', 'sad');
  if (prev && r.nb > prev.nb * 1.8 && r.nb > 80) add(2, 'boom', '去年の倍ちかく咲きました。空いた土に、いっせいに芽が出たんです', 'happy');
  const prefD = (k) => { let d = r.prefs[k] - SPECIES[k].pref; if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
  for (const k of ['bee', 'butterfly']) if (Math.abs(prefD(k)) > 13) add(1.1, 'pref' + k, `${SP_NAME[k]}の好みが、少し変わってきました。花に合わせて、虫のほうも変わるんですね`);
  if (!c.length) return;
  c.sort((a, b) => b.score - a.score);
  const m = c[0]; Talk.coolY[m.key] = y;
  say(m.text, { year: y, pri: 2, mood: m.mood, topic: 'rev' + y, ttl: 20 });
}

function erikaStatus(sim) {
  const st = sim.nowStats(), t = sim.t;
  if (t >= sim.w.onset / TICKS || t < 0.06) return `いまは冬です。土の中で、種が${sim.bank.length}粒ねむっています`;
  if (!st.n) return 'まだ咲いている花はありません。もうすぐです';

function flowerThumb(g, size, seed = 7) {

// 株まるごとの肖像
function plantPortrait(g, w, h, id = 11) {
  const dp = Math.min(window.devicePixelRatio || 1, 2), c = mkCanvas(w * dp, h * dp), x = c.getContext('2d');
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const p = { g, id }, geo = plantGeom(p, 1);
  const k = Math.min((h * 0.86) / (geo.y1 - geo.y0 + geo.R * 1.4), (w * 0.9) / (geo.x1 - geo.x0 + geo.R * 2.4)) * dp;
  const body = paintBody(p, geo, k, 'green'), bx = w * dp / 2 - ((geo.x0 + geo.x1) / 2) * k, by = h * dp * 0.95;
  blob(x, w * dp / 2, by, w * dp * 0.36, h * dp * 0.035, [120, 150, 110], 0.3, 3, 0.2);
  x.drawImage(body.c, bx - body.ox, by - body.oy);
  const fl = paintFlower(g, geo.R * k, id);
  for (const hd of geo.heads) { x.save(); x.translate(bx + hd.x * k, by + hd.y * k); if (fl.kind === 'face') { const a = hash2(id, 300 + geo.heads.indexOf(hd)); x.rotate((hash2(id, 340 + geo.heads.indexOf(hd)) - 0.5) * 0.6); x.scale(hd.r, hd.r * (0.6 + 0.38 * a)); x.rotate(fl.upright ? 0 : hd.rot); } else { x.rotate(hd.ang * 0.5); x.scale(hd.r, hd.r); } x.drawImage(fl.c, -fl.ax, -fl.ay); x.restore(); }
  freeCanvas(body.c); freeCanvas(fl.c);
  return c;
}

const AU = { ctx: null, on: false, wind: null, rain: null, lastChime: 0, nextBird: 3 };
function audioStart() {
  if (!AU.ctx) {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const a = (AU.ctx = new C());
    const buf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), d = buf.getChannelData(0); let b = 0;
    for (let i = 0; i < d.length; i++) { b = b * 0.98 + (Math.random() * 2 - 1) * 0.02; d[i] = b * 6 + (Math.random() * 2 - 1) * 0.15; }
    const mk = (type, f, q) => { const s = a.createBufferSource(); s.buffer = buf; s.loop = true; const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = a.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(); return { g, fl }; };
    AU.master = a.createGain(); AU.master.gain.value = 0; AU.master.connect(a.destination);
    AU.wind = mk('bandpass', 420, 0.6); AU.rain = mk('highpass', 2400, 0.3);
  }
  AU.ctx.resume(); AU.on = true; AU.master.gain.linearRampToValueAtTime(0.9, AU.ctx.currentTime + 1.2);
}
function audioStop() { if (AU.ctx) { AU.on = false; AU.master.gain.linearRampToValueAtTime(0, AU.ctx.currentTime + 0.5); } }
function tone(f, dur, vol, type = 'sine', slide = 0, delay = 0) {
  const a = AU.ctx, t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + 0.05);
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
function chime(hue, big) { // 花が開く音。色で高さが変わる
  if (!AU.on) return; const t = performance.now(); if (t - AU.lastChime < 140) return; AU.lastChime = t;
  const f = PENTA[Math.floor((hueWrap(hue) / 360) * PENTA.length)];
  tone(f, 1.6, big ? 0.07 : 0.035, 'sine'); tone(f * 2, 0.9, 0.012, 'triangle'); if (big) tone(f * 1.5, 1.8, 0.03, 'sine', 0, 0.12);
}
function audioTick(dt, e) {
  if (!AU.on) return; const a = AU.ctx, t = a.currentTime;
  AU.wind.g.gain.setTargetAtTime(0.02 + clamp(V.wind / 3) * 0.2, t, 0.4); AU.wind.fl.frequency.setTargetAtTime(320 + V.wind * 260, t, 0.5);
  AU.rain.g.gain.setTargetAtTime(e.rain * 0.09, t, 0.5);
  AU.nextBird -= dt;
  if (AU.nextBird < 0) {
    AU.nextBird = 2.5 + Math.random() * 7;
    if (e.night > 0.5 && e.t > 0.4 && e.t < 0.8) { for (let i = 0; i < 5; i++) tone(4200, 0.07, 0.012, 'sine', 1.02, i * 0.09); } // 虫の声
    else if (e.night < 0.3 && e.snow < 0.5 && e.rain < 0.3) { const f = 2200 + Math.random() * 1400, n = 2 + ((Math.random() * 3) | 0); for (let i = 0; i < n; i++) tone(f * (1 + i * 0.06), 0.11, 0.016, 'sine', 1.25, i * 0.14); } // 鳥
  }
}

function resetAll() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.hash = ''; location.reload(); }

function handleEvents(live) {
  const out = sim.out; if (!out.length) return;
  for (let i = 0; i < out.length; i++) {
    const ev = out[i];
    if (ev.type === 'newyear') { snap = sim.save(); if (live) saveAll(); }
    if (!live) { if (ev.type === 'novel' && ev.plant) addSketch(ev.plant, `はじめての${ev.name}`); continue; }
    if (ev.type === 'bloom') {
      const v = V.views.get(ev.plant.id);
      if (v && V.fast < 0.5) { const hp = headPos(v, false); if (hp) spawn('spark', hp[0], hp[1], { n: 3, col: toneCss(ev.plant.g, 0.95), s: v.pos.ds }); }
      if (V.fast < 0.5 || Math.random() < 0.12) chime(ev.plant.g.h, ev.plant.g.sz > 0.6);
    } else if (ev.type === 'seed') {
      const v = V.views.get(ev.plant.id);
      if (v && v.hp.length) { const n = Math.min(V.fast > 0.5 ? 1 : 4, ev.n); for (let k = 0; k < n; k++) { const hp = headPos(v, false); if (hp) spawn('seed', hp[0], hp[1], { s: v.pos.ds }); } const hp = headPos(v, false); if (hp && V.fast < 0.5) spawn('petal', hp[0], hp[1], { n: 3, s: v.pos.ds, col: toneCss(ev.plant.g, 0.85) }); }
    } else if (ev.type === 'event') {
      if (ev.kind === 'storm') { V.storm = 5; V.flash = 1; setTimeout(() => (V.flash = 0.8), 900); }
      else if (ev.kind === 'frost') V.frost = 1;
    }
    onSimEvent(ev, sim);
  }
  out.length = 0;
}

// 留守のあいだ（または早回し）をまとめて進める
function fastForward(years, greet) {
  const before = sim.hist[sim.hist.length - 1], y0 = sim.year, seen0 = Object.keys(sim.seen.colors).length;
  sim.quiet = true; const target = sim.year + years; let ext = [];
  while (sim.year < target) { sim.step(); for (const e of sim.out) if (e.type === 'extinct' && e.name !== '旅の種') ext.push(e.name); handleEvents(false); }
  sim.quiet = false;
  for (const v of V.views.values()) { freeCanvas(v.body && v.body.c); freeCanvas(v.fl && v.fl.c); freeCanvas(v.flB && v.flB.c); } V.views.clear(); V.order = []; V.queue.length = 0; V.bugs.clear(); V.parts.length = 0;
  saveAll();
  if (!greet) return;
  const after = sim.hist[sim.hist.length - 1]; let msg = `おかえりなさい。留守のあいだに${sim.year - y0}年たちました。`;
  if (before && after && before.topName !== after.topName) msg += `前は${before.topName}が多かったのに、いまは${after.topName}の花畑です`;
  else if (Object.keys(sim.seen.colors).length > seen0) msg += `はじめての色が${Object.keys(sim.seen.colors).length - seen0}つ咲きました。スケッチ帳に描いてあります`;
  else if (ext.length) msg += `${ext[0]}の系統が、途絶えてしまいました`;
  else msg += '花は少しずつ、形を変えています';
  say(msg, { pri: 5, mood: 'happy', year: sim.year, ttl: 30 });
}

function setSpeed(i) { speedIdx = i; $('bSpeed').dataset.i = i; $('bSpeed').querySelector('small').textContent = SPEEDS[i][1]; }
function setFace(m) { if (!faceOK) return; for (const im of $('erika').children) im.classList.toggle('on', im.dataset.m === m); }

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016); lastT = ts;
  const mult = SPEEDS[speedIdx][0];
  V.fast += ((mult >= 4 ? 1 : 0) - V.fast) * Math.min(1, dt * 1.5);
  if (!titleOn && !UI.paused) {
    acc += (dt * TICKS * mult) / YEAR_SEC;
    let n = 0; while (acc >= 1 && n < 10) { sim.step(); acc -= 1; n++; handleEvents(true); }
    if (acc > 3) acc = 0;
  }
  syncViews(sim); syncBugs(sim);
  const e = drawScene(sim, Math.min(1, acc), dt);
  const ctx = V.ctx;
  if (!faceOK) drawErika(ctx, V.W * 0.17, V.H - 4, V.unit * 0.98, { time: V.time, wind: V.wind, rain: e.rain, cold: e.snow, talking: !!Talk.cur });
  talkTick(dt); idleTalk(sim); setFace(ERIKA.mood === 'calm' && Talk.cur ? 'calm' : ERIKA.mood);
  setHud(sim); audioTick(dt, e);
}

function boot() {
  initGrain();
  V.cv = $('cv'); V.ctx = V.cv.getContext('2d'); Talk.el = $('bubble');
  $('paper').style.backgroundImage = `url(${paperTexture()})`;
  resizeView(); addEventListener('resize', () => { clearTimeout(boot.rt); boot.rt = setTimeout(resizeView, 120); });
  // 続きから／はじめから
  let saved = null; try { saved = HASH.fresh || HASH.nosave ? null : JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (saved && saved.sim && saved.sim.v === 2) {
    try { sim = Sim.load(saved.sim); sim.resume(); snap = saved.sim; UI.zukan = saved.zukan || []; Talk.diary = saved.diary || []; Talk.coolY = saved.coolY || {}; if (saved.opt) { speedIdx = saved.opt.speed ?? 1; Talk.on = saved.opt.talk !== false; } sim.out.length = 0; }
    catch (e) { sim = null; }
  }
  const isNew = !sim;
  if (!sim) { sim = Sim.fresh(+HASH.seed || (Date.now() % 1e9)); snap = sim.save(); sim.out.length = 0; }
  if (HASH.y) fastForward(+HASH.y - sim.year, false);
  else if (!isNew && saved.ts) { const yrs = Math.min(400, Math.floor((Date.now() - saved.ts) / 1000 / YEAR_SEC)); if (yrs >= 1) fastForward(yrs, true); }
  if (HASH.tk) { sim.quiet = true; while (sim.tick < +HASH.tk) sim.step(); sim.quiet = false; sim.out.length = 0; }
  if (HASH.speed) speedIdx = +HASH.speed;
  setSpeed(speedIdx); $('bTalk').classList.toggle('off', !Talk.on);
  // エリカの顔（絵があれば絵、なければ手描き）
  const moods = ['calm', 'wow', 'happy', 'sad']; let loaded = 0;
  moods.forEach((m) => { const im = new Image(); im.dataset.m = m; im.alt = ''; im.onload = () => { if (++loaded === 4) { faceOK = true; $('erika').classList.add('ready'); setFace('calm'); } }; im.src = `erika-${m}.webp`; $('erika').appendChild(im); });
  // 操作
  $('bSpeed').onclick = () => { setSpeed((speedIdx + 1) % SPEEDS.length); saveAll(); };
  $('bZukan').onclick = () => (UI.sheet === 'zukan' ? closeSheet() : showZukan());
  $('bHist').onclick = () => (UI.sheet === 'hist' ? closeSheet() : showHistory(sim));
  $('bSound').onclick = () => { UI.sound = !UI.sound; $('bSound').classList.toggle('off', !UI.sound); UI.sound ? audioStart() : audioStop(); };
  $('bTalk').onclick = () => { Talk.on = !Talk.on; $('bTalk').classList.toggle('off', !Talk.on); if (!Talk.on) { Talk.q.length = 0; Talk.endAt = 0; } else say('はい。また気づいたことを、お話ししますね', { pri: 5, diary: false }); saveAll(); };
  $('close').onclick = closeSheet;
  // ボタンは、しばらくさわらなければ小さく薄くなって絵をゆずる
  let idleT = 0; const wake = () => { $('btns').classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => $('btns').classList.add('idle'), 6000); }; addEventListener('pointerdown', wake, true); wake();
  $('erika').onclick = $('bubble').onclick = () => { if (Talk.cur) { Talk.endAt = 0; return; } say(erikaStatus(sim), { pri: 6, force: true, diary: false, mood: 'happy' }); ERIKA.hop = 1; };
  let down = null;
  V.cv.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
  V.cv.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 10) return; down = null;
    if (UI.sheet) return closeSheet();
    const r = V.cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    if (!faceOK && px < V.W * 0.34 && py > V.H - 150 * V.unit) return $('erika').onclick();
    const v = pickPlant(px, py); if (v) { showPlant(v.p, sim); spawn('spark', px, py, { n: 4 }); }
  });
  const endTitle = () => { if (!titleOn) return; titleOn = false; $('title').classList.add('gone'); setTimeout(() => $('title').remove(), 1800);
    if (isNew) { say('こんにちは。エリカです。この花畑を観察しています', { pri: 9, mood: 'happy', diary: false, ttl: 40 }); say('誰も手を入れません。虫と風と天気にまかせて、花がどう変わるか見ています', { pri: 8, diary: false, ttl: 60 }); say('わたしの星では、花は毎年おなじです。ここは違うみたいなんです', { pri: 7, diary: false, ttl: 90 }); } };
  $('title').onclick = endTitle;
  if (HASH.notitle) { titleOn = false; $('title').remove(); } else setTimeout(endTitle, 4200);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); saveAll(); }
    else if (hiddenAt) { const yrs = Math.min(400, Math.floor(((Date.now() - hiddenAt) / 1000 / YEAR_SEC) * SPEEDS[speedIdx][0])); hiddenAt = 0; lastT = performance.now(); if (yrs >= 2) fastForward(yrs, true); }
  });
  addEventListener('pagehide', saveAll);
  if (HASH.panel === 'hist') showHistory(sim); else if (HASH.panel === 'zukan') showZukan(); else if (HASH.panel === 'plant') setTimeout(() => { const p = sim.plants.find((q) => q.state === 1) || sim.plants[0]; if (p) showPlant(p, sim); }, 600);
  if (HASH.storm) setTimeout(() => { V.storm = 6; }, 300);
  if (HASH.say) setTimeout(() => say(decodeURIComponent(HASH.say), { pri: 9, force: true, mood: HASH.mood || 'calm' }), 400);
  if (HASH.nopaper) $('paper').style.display = 'none'; if (HASH.notuft) V.noTuft = 1; if (HASH.noband) V.noBand = 1; if (HASH.noplant) V.noPlant = 1; if (HASH.dpr) V.dprLock = 1; if (HASH.dpr) { V.dprCap = +HASH.dpr; resizeView(); }
  window.__hana = { get sim() { return sim; }, V, Talk, say };
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
</body>
